<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Startup diagnostics concept</title><desc id="desc">Three proposed investigation states: before readiness, after readiness, and unknown. No live data.</desc>
<rect width="1200" height="750" fill="#ededee"/>
<g fill="#141518" font-family="Arial, sans-serif"><text x="72" y="94" font-size="19" letter-spacing="3">ROBLOX / INDEPENDENT CONCEPT</text><text x="72" y="195" font-size="65" font-weight="700" letter-spacing="-3">Ready to play?</text><text x="72" y="244" font-size="25" fill="#52565e">A clearer first question for early exits.</text></g>
<rect x="72" y="308" width="1056" height="337" rx="20" fill="#fff" stroke="#c9cbce"/>
<path d="M92 308H1108Q1128 308 1128 328V375H72V328Q72 308 92 308" fill="#141518"/>
<g font-family="Arial, sans-serif"><text x="104" y="350" fill="#fff" font-size="20">Startup diagnostic summary</text><text x="887" y="349" fill="#fff" font-size="15">CONCEPT / NO LIVE DATA</text></g>
<g fill="#f6f6f7" stroke="#ced0d3"><rect x="104" y="407" width="309" height="202" rx="9"/><rect x="445" y="407" width="309" height="202" rx="9"/><rect x="786" y="407" width="309" height="202" rx="9" stroke-dasharray="6 6"/></g>
<g font-family="Arial, sans-serif" fill="#141518"><text x="130" y="460" font-size="32">←</text><text x="471" y="460" font-size="32">→</text><text x="812" y="460" font-size="32">?</text><text x="130" y="511" font-weight="700" font-size="24">Before readiness</text><text x="471" y="511" font-weight="700" font-size="24">After readiness</text><text x="812" y="511" font-weight="700" font-size="24">Unknown</text><g fill="#52565e" font-size="19"><text x="130" y="551">Investigate startup</text><text x="471" y="551">Investigate play</text><text x="812" y="551">Check signal coverage</text></g></g>
<text x="72" y="697" font-family="Arial, sans-serif" fill="#52565e" font-size="18">A missing readiness event is not proof of a loading failure.</text>
</svg>
